<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hookGrad" x1="160" y1="100" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle circular rings -->
  <circle cx="256" cy="256" r="190" stroke="rgba(56, 189, 248, 0.15)" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" stroke="rgba(99, 102, 241, 0.2)" stroke-width="3" />

  <!-- Stylized Book Base -->
  <path d="M 140 370 Q 256 340 372 370 L 372 350 Q 256 320 140 350 Z" fill="#94a3b8" opacity="0.6" />
  <path d="M 140 390 Q 256 360 372 390 L 372 370 Q 256 340 140 370 Z" fill="#64748b" opacity="0.8" />
  
  <!-- Glowing Hook (قلاب) -->
  <g filter="url(#glow)">
    <!-- Top Eyelet -->
    <circle cx="256" cy="140" r="26" fill="none" stroke="#38bdf8" stroke-width="16" />
    <!-- Hook Shank -->
    <path d="M 256 166 L 256 280 C 256 350 180 350 180 290 C 180 260 205 240 225 255" fill="none" stroke="url(#hookGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sharp Hook Barb -->
    <polygon points="215,245 235,255 220,265" fill="#38bdf8" />
  </g>

  <!-- Sparks / Stars -->
  <circle cx="340" cy="180" r="6" fill="#38bdf8" />
  <circle cx="370" cy="240" r="4" fill="#818cf8" />
  <circle cx="150" cy="200" r="5" fill="#38bdf8" />
</svg>